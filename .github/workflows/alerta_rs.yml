name: Alerta RS 24h (Bira e Bia)

# Consulta avisos oficiais a cada 15 min (GitHub pode atrasar).
# Alerta laranja/vermelho a qualquer hora; amarelo na janela 10h00–15h.
# Mantém gate, idempotência, Reel e Story; push/manual padrão sem publicar.

on:
  schedule:
    - cron: "5,20,35,50 * * * *"
    - cron: "0 13 * * *"
  push:
    paths:
      - '.github/workflows/alerta_rs.yml'
      - 'scripts/monitor_alertas_rs.py'
      - 'scripts/alerta_auto_rs.py'
      - 'scripts/publicar_alerta_rs.py'
      - 'tests/test_alerta_rs_rede.py'
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar no Instagram se houver aviso inédito? Desmarcado = só artifact"
        type: boolean
        default: false

permissions:
  contents: write

env:
  ALVO: "10:00"
  PRAZO: "15:00"
  FUSO_UTC: "-3"

jobs:
  prechecagem:
    if: github.event_name == 'schedule' && vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    outputs:
      seguir: ${{ steps.decisao.outputs.seguir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Checar avisos sem ocupar fila de publicação
        id: decisao
        run: |
          pip install -q PyYAML
          HORA=$(TZ=America/Sao_Paulo date +%H%M)
          if [[ "$HORA" < "1000" || "$HORA" > "1459" ]]; then
            export RS_ALERTA_SEVERO_APENAS=true
          fi
          python -m scripts.monitor_alertas_rs
          python -m scripts.alerta_auto_rs decidir
  alerta:
    needs: prechecagem
    if: ${{ always() && (github.event_name != 'schedule' || (vars.AUTOMATION_ENABLED == 'true' && needs.prechecagem.outputs.seguir == 'sim')) }}
    concurrency:
      group: canal-publicacao
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Publicar nesta execução?
        id: modo
        env:
          EVENTO: ${{ github.event_name }}
          IN_PUBLICAR: ${{ inputs.publicar }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            P="$IN_PUBLICAR"
          elif [ "$EVENTO" = "push" ]; then
            P=false
          else
            P=true
            HORA=$(TZ=America/Sao_Paulo date +%H%M)
            if [[ "$HORA" < "1000" || "$HORA" > "1459" ]]; then
              echo "RS_ALERTA_SEVERO_APENAS=true" >> "$GITHUB_ENV"
            fi
          fi
          echo "publicar=$P" >> "$GITHUB_OUTPUT"

      - name: Consultar avisos oficiais do INMET e Defesa Civil
        if: ${{ steps.modo.outputs.publicar != 'atrasado' }}
        run: |
          pip install -q PyYAML
          python -m scripts.monitor_alertas_rs

      - name: Há aviso inédito?
        id: decisao
        if: ${{ steps.modo.outputs.publicar != 'atrasado' }}
        run: |
          python -m scripts.alerta_auto_rs decidir \
            --alertas output/alertas_rs.json \
            --historico data/alertas_publicados.json \
            --out comunicados/auto/alerta_rs.yaml \
            --decisao output/alerta_decisao.json

      - name: Sem alerta hoje
        if: ${{ steps.decisao.outputs.seguir != 'sim' }}
        run: |
          echo "### Sem alerta nesta execução" >> "$GITHUB_STEP_SUMMARY"
          cat output/alerta_decisao.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # --------------------------------------------------------- comunicado

      - name: Preparar HyperFrames
        if: ${{ steps.decisao.outputs.seguir == 'sim' }}
        uses: ./.github/actions/setup-hyperframes

      - name: Dependências
        if: ${{ steps.decisao.outputs.seguir == 'sim' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg espeak-ng
          pip install -r requirements/test.txt -r requirements/comunicado.txt

      - name: Renderizar o alerta (Bira e Bia)
        if: ${{ steps.decisao.outputs.seguir == 'sim' }}
        run: |
          python hyperframes/comunicado_dupla.py comunicados/auto/alerta_rs.yaml --so-validar
          python hyperframes/comunicado_dupla.py comunicados/auto/alerta_rs.yaml --out output/REEL.mp4
          python scripts/qa_video.py output/REEL.mp4
          {
            echo "## Aviso"; echo '```'; cat output/alerta_decisao.json; echo '```'
            echo "## Roteiro falado"; echo '```'; cat output/work_comunicado/roteiro.txt; echo '```'
            echo "## Legenda"; echo '```'; cat output/LEGENDA.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alerta-rs-${{ github.run_id }}
          path: |
            output/REEL.mp4
            output/CAPA.jpg
            output/LEGENDA.txt
            output/alerta_decisao.json
            output/alertas_rs.json
            comunicados/auto/alerta_rs.yaml
          if-no-files-found: warn
          retention-days: 3

      # ---------------------------------------------------------- publicação

      - name: Verificar Meta e conta de destino
        if: ${{ steps.decisao.outputs.seguir == 'sim' && steps.modo.outputs.publicar == 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          EXPECTED_IG_USERNAME: ${{ vars.EXPECTED_IG_USERNAME }}
        run: python -c "from src.previsao.publish.instagram import verify_destination; print('destino:',verify_destination().get('username'))"

      - name: Exigir hospedagem pública
        if: ${{ steps.decisao.outputs.seguir == 'sim' && steps.modo.outputs.publicar == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh repo view "$GITHUB_REPOSITORY" --json visibility -q .visibility)" = PUBLIC

      - name: Hospedar MP4 em Release temporário
        if: ${{ steps.decisao.outputs.seguir == 'sim' && steps.modo.outputs.publicar == 'true' }}
        id: media
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="alerta-${{ github.run_id }}"
          ARQS="output/REEL.mp4"
          [ -f output/CAPA.jpg ] && ARQS="$ARQS output/CAPA.jpg"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ARQS --clobber
          else
            gh release create "$TAG" $ARQS --title "$TAG" --notes "Alerta RS"
          fi
          echo "url=https://github.com/${{ github.repository }}/releases/download/$TAG/REEL.mp4" >> "$GITHUB_OUTPUT"
          if [ -f output/CAPA.jpg ]; then
            echo "capa=https://github.com/${{ github.repository }}/releases/download/$TAG/CAPA.jpg" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar o alerta
        if: ${{ steps.decisao.outputs.seguir == 'sim' && steps.modo.outputs.publicar == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          EXPECTED_IG_USERNAME: ${{ vars.EXPECTED_IG_USERNAME }}
          PREVISAO_CAPA_URL: ${{ steps.media.outputs.capa }}
        run: |
          dia=$(TZ=America/Sao_Paulo date +%F)
          ref="tags/alerta-diario-${dia}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/$ref" --silent 2>/dev/null; then
            echo "Alerta diário já reservado: $dia" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/$ref" -f "sha=$GITHUB_SHA" --silent; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/$ref" --silent; then
              echo "Alerta diário já reservado: $dia" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit 1
          fi
          export PREVISAO_CAPA_MS=$(cat output/capa_ms.txt 2>/dev/null || echo 0)
          python -c 'import json; from datetime import datetime; d=json.load(open("output/alerta_decisao.json")); assert datetime.fromisoformat(d["fim"]) > datetime.now().astimezone(), "Aviso expirado antes da publicação"'
          python -m scripts.publicar_alerta_rs \
            --video-url "${{ steps.media.outputs.url }}" \
            --caption-file output/LEGENDA.txt \
            --historico data/alertas_publicados.json \
            --decisao output/alerta_decisao.json

      - name: Persistir o histórico de alertas
        if: ${{ always() && steps.decisao.outputs.seguir == 'sim' && steps.modo.outputs.publicar == 'true' }}
        run: |
          set -euo pipefail
          test -f data/alertas_publicados.json || exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alertas_publicados.json
          git diff --cached --quiet && exit 0
          git commit -m "Alertas RS: histórico após execução ${{ github.run_id }}"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Apagar o Release temporário após confirmação
        if: ${{ success() && steps.decisao.outputs.seguir == 'sim' && steps.modo.outputs.publicar == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "alerta-${{ github.run_id }}" --repo "${{ github.repository }}" --cleanup-tag --yes || true
